<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو البوستات</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header class="top">
  <div class="brandline">
    <h1>استوديو البوستات</h1>
    <p>اكتب النص، اختر الشكل، ونزّل البوست جاهز بهوية بيت التمويل.</p>
  </div>
</header>

<main class="layout">
  <section class="preview" aria-label="المعاينة">
    <div class="stage"><canvas id="canvas"></canvas></div>
    <p id="warn" class="warn" hidden>النص طويل على هالمساحة، صغّرناه تلقائياً. الأفضل تختصره.</p>
    <button id="download" class="download" type="button">تحميل البوست</button>
  </section>

  <section class="controls">
    <div class="step">
      <h2>الشكل</h2>
      <div id="templates" class="templates"></div>
    </div>

    <div class="step">
      <h2>المقاس</h2>
      <div class="seg" data-field="format">
        <button type="button" data-value="post">منشور</button>
        <button type="button" data-value="story">ستوري</button>
        <button type="button" data-value="square">مربع</button>
      </div>
    </div>

    <div class="step" data-show="text cutout offer">
      <h2>الخلفية</h2>
      <div class="swatches" data-field="combo">
        <button type="button" data-value="dark" style="--sw:#2D7864" aria-label="أخضر غامق"></button>
        <button type="button" data-value="green" style="--sw:#43B02A" aria-label="أخضر فاتح"></button>
        <button type="button" data-value="white" style="--sw:#FFFFFF" aria-label="أبيض"></button>
      </div>
    </div>

    <div class="step" data-show="photo panel cutout offer">
      <h2>الصورة</h2>
      <label class="upload">
        <input type="file" accept="image/*" id="photo">
        <span id="photoLabel">اختر صورة</span>
      </label>
      <p class="hint" data-show="cutout offer">استخدم صورة
        <bdi>PNG</bdi>
        بدون خلفية عشان تطلع مفرّغة.</p>
      <div data-show="photo panel">
        <label class="range">تحريك أفقي <input type="range" min="0" max="1" step="0.01" data-field="fx"></label>
        <label class="range">تحريك عمودي <input type="range" min="0" max="1" step="0.01" data-field="fy"></label>
        <label class="range">تكبير <input type="range" min="1" max="2.5" step="0.01" data-field="zoom"></label>
      </div>
      <div data-show="cutout offer">
        <label class="range">حجم الصورة <input type="range" min="0.5" max="1.3" step="0.01" data-field="cutScale"></label>
      </div>
    </div>

    <div class="step">
      <h2>النصوص</h2>
      <label class="field" data-show="text photo panel cutout">سطر تمهيدي <small>اختياري</small>
        <input type="text" data-field="kicker" placeholder="تقديراً لـ ...">
      </label>
      <label class="field">العنوان
        <textarea rows="3" data-field="headline" placeholder="اكتب العنوان. كل سطر جديد = سطر في التصميم"></textarea>
      </label>
      <label class="field">سطر توضيحي <small>اختياري</small>
        <input type="text" data-field="sub">
      </label>
      <div class="seg" data-field="align" data-show="text photo panel">
        <button type="button" data-value="right">محاذاة يمين</button>
        <button type="button" data-value="center">في الوسط</button>
      </div>
    </div>

    <div class="step" data-show="text photo panel offer">
      <h2>رقم بارز <small>اختياري</small></h2>
      <div class="row">
        <label class="field">الرقم <input type="text" data-field="number" inputmode="decimal" placeholder="15%"></label>
        <label class="field">بجانبه <input type="text" data-field="unit" placeholder="د.ك"></label>
      </div>
      <label class="field">فوق الرقم <input type="text" data-field="numLabel" placeholder="خصم"></label>
    </div>

    <div class="step">
      <h2>إضافات <small>اختياري</small></h2>
      <div data-show="text photo panel offer">
        <label class="field">زر <input type="text" data-field="cta" placeholder="افتح حسابك الآن"></label>
        <div class="seg" data-field="ctaColor">
          <button type="button" data-value="green">زر أخضر فاتح</button>
          <button type="button" data-value="dark">زر أخضر غامق</button>
        </div>
      </div>
      <label class="upload small">
        <input type="file" accept="image/*" id="logo">
        <span id="logoLabel">شعار جهة شريكة</span>
      </label>
      <button type="button" class="link" id="clearLogo" hidden>إزالة الشعار</button>
      <label class="field">الشروط والأحكام <input type="text" data-field="terms" placeholder="تطبق الشروط والأحكام"></label>
      <label class="check" data-show="text photo"><input type="checkbox" data-field="curve"> الخط المنحني</label>
      <label class="check" data-show="text"><input type="checkbox" data-field="wedge"> قطعة خضراء في الزاوية</label>
    </div>
  </section>
</main>

<script src="render.js"></script>
<script src="studio.js"></script>
</body>
</html>
